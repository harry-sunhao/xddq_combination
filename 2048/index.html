<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>炼器大会AI | 寻道大千</title>
  <meta name="description" content="基于 AI 算法的 炼器大会，支持 Expectimax、贪婪算法、手动模式。">
  <meta name="baidu-site-verification" content="codeva-wHipxPyLvU" />
  <meta name="keywords" content="寻道大千, 工具合集, 导航平台, 在线资源, 实用网站, 炼器大会">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      padding: 10px;
      font-family: sans-serif;
    }
  
    #grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 440px;
      margin: 0 auto;
    }
  
    #grid input {
      width: 22vw;
      height: 22vw;
      max-width: 100px;
      max-height: 100px;
      text-align: right;
      font-size: 14px;
      background-color: white;
      background-size: 100% 100%;
      border: 1px solid #aaa;
      margin: 1px;
      box-sizing: border-box;
    }
  
    .n {
      color: black;
      font-size: 16px;
    }
  
    button {
      padding: 10px;
      margin: 5px;
    }
  
    @media (max-width: 600px) {
      #grid input {
        width: 21vw;
        height: 21vw;
        max-width: none;
        max-height: none;
      }
    }
  </style>
  
</head>
<body>

  <p>
    点击格子左边 -1，点击右边 +1，设置后点击“走一步”模拟移动<br>
    <button id="go">走一步</button>
    <button id="use-recommend" style="display:none;">使用推荐方向</button>
    <button onclick="clear1()">清空</button>
    <span>移动方向：</span><br>
    模拟：<span id="original-move">-</span> | 评分：<span id="original-score">0</span><br>
    改进算法方向：<span id="improved-move">-</span> | 评分：<span id="improved-score">0</span>
  </p>

  <div id="grid">
    <input class="cell" id="grid_0_0" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_1_0" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_2_0" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_3_0" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()"><br>

    <input class="cell" id="grid_0_1" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_1_1" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_2_1" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_3_1" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()"><br>

    <input class="cell" id="grid_0_2" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_1_2" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_2_2" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_3_2" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()"><br>

    <input class="cell" id="grid_0_3" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_1_3" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_2_3" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
    <input class="cell" id="grid_3_3" onkeydown="return false" oncontextmenu="return false" onchange="setGrid()">
  </div>

  <script type="module" src="main_expectimax.js" defer></script>
  <script>
    // 触摸滑动监听
    let touchStartX = 0, touchStartY = 0;
    document.body.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    });
    document.body.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
      let dir = -1;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 1 : 3; // 右 or 左
      else dir = dy > 0 ? 2 : 0; // 下 or 上
      if (typeof game !== 'undefined' && game.move) {
        game.move(dir);
        if (typeof getGrid === 'function') getGrid(dir);
      }
    });
  </script>
</body>
</html>
