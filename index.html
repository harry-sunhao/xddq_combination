<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寻道大千功能合集</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background: #007bff;
    }
    .tab-button {
      flex: 1 1 auto;
      min-width: 140px;
      padding: 15px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
    }
    .tab-button.active {
      background: #0056b3;
    }
    .tab-content {
      display: none;
      flex-grow: 1;
    }
    .tab-content.active {
      display: block;
    }
    iframe {
      width: 100%;
      height: 60dvh;
      border: none;
      display: block;
    }
    .donation {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 5px;
    }
    .donation img {
      width: 100%;
      max-width: 480px;
      height: auto;
      margin-top: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    footer {
      font-size: 13px;
      color: #999;
      text-align: center;
      padding: 5px 10px 10px;
      margin-top: auto;
    }
    @media (max-width: 600px) {
      .tab-button {
        font-size: 14px;
        padding: 12px;
      }
      .donation img {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <header>
    <button class="tab-button active" onclick="switchTab('tab-chess')">仙兽棋盘推荐</button>
    <button class="tab-button" onclick="switchTab('tab-2048')">炼器大会AI</button>
  </header>

  <div id="tab-chess" class="tab-content active">
    <iframe id="iframe-chess" src="./chess.html"></iframe>
  </div>

  <div id="tab-2048" class="tab-content">
    <iframe id="iframe-2048" src="2048/index.html"></iframe>
  </div>



  <div class="donation">
    ☕ 如果你觉得有用，欢迎打赏支持：<br>
    <img src="./img/qrcode.jpg" alt="打赏二维码">
  </div>

  <footer>
    <div>
      © 2025 桃源·太叔 版权所有 · Powered by
      <a href="https://github.com/harry-sunhao" target="_blank" style="color:#999; text-decoration:none; margin-left: 5px;">云在天(Harry)</a>
    </div>
    <div>
      <span id="busuanzi_container_site_pv" style="margin-right: 10px;">
        🔢 访问总量：<span id="busuanzi_value_site_pv"></span>
      </span>
      <span id="busuanzi_container_site_uv" style="margin-right: 10px;">
        👥 访客数：<span id="busuanzi_value_site_uv"></span>
      </span>
    </div>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  </footer>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelector(`[onclick*="${id}"]`).classList.add('active');
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
