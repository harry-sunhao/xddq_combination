<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>仙兽棋盘可能组合模拟器</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 60px); gap: 10px; margin-bottom: 20px; }
    .cell {
      width: 60px; height: 60px; text-align: center; line-height: 60px;
      border: 1px solid #999; cursor: pointer; border-radius: 6px;
      user-select: none; font-weight: bold;
    }
    .金 { background-color: gold; }
    .绿 { background-color: lightgreen; }
    .蓝 { background-color: lightblue; }
    .matched { outline: 3px solid green; }
    .potential { outline: 3px dashed orange; }
    .warn { outline: 3px solid red; }
    textarea { width: 100%; height: 60px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>仙兽棋盘可能组合模拟器</h2>
  <p>点击格子循环设置颜色（金 → 绿 → 蓝 → 空）</p>
  <div class="grid" id="grid"></div>
  <button onclick="checkCombinations()">分析组合</button>
  <button onclick="resetGrid()">重置</button>
  <button onclick="suggestCombination()">添加我的组合建议</button>
  <button onclick="recommendNextDraw()">智能推荐下一步</button>
  <h3>结果</h3>
  <div id="results"></div>
  <h3>建议提交</h3>
  <textarea id="suggestionBox" readonly placeholder="你点击格子后生成的组合会显示在这里，复制后可反馈给作者"></textarea>

  <script>
    const positions = [
      '31','32','33','34',
      '21','22','23','24',
      '11','12','13','14'
    ];
    const grid = document.getElementById('grid');
    const colors = ['', '金', '绿', '蓝'];
    const cellStates = {};
    let combinationData = {};

    positions.forEach(pos => {
      const div = document.createElement('div');
      div.className = 'cell';
      div.id = 'cell-' + pos;
      div.innerText = pos;
      div.onclick = () => {
        const current = cellStates[pos] || '';
        const nextColor = colors[(colors.indexOf(current) + 1) % colors.length];
        cellStates[pos] = nextColor;
        div.className = 'cell ' + nextColor;
        div.innerText = nextColor ? pos + "\n(" + nextColor + ")" : pos;
      };
      grid.appendChild(div);
    });

    function checkCombinations() {
      if (!combinationData || Object.keys(combinationData).length === 0) return;
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('matched', 'potential', 'warn'));
      const allResults = [];
      const matched = [], potential = [], warning = [], others = [];

      for (const [color, combos] of Object.entries(combinationData)) {
        for (const group of combos) {
          const states = group.map(p => cellStates[p] || '');
          const known = states.filter(v => v);
          const allMatch = known.length === 3 && known.every(v => v === color);
          const partialMatch = known.length === 2 && known.every(v => v === color);

          if (allMatch) {
            group.forEach(p => document.getElementById('cell-' + p).classList.add('matched'));
            matched.push(`✔️ 已匹配3个 ${color}: ${group.join(', ')}`);
          } else if (partialMatch && states.includes('')) {
            group.forEach(p => document.getElementById('cell-' + p).classList.add('potential'));
            if (color === '金') {
              potential.push(`⚠️ 可能组合 (${color}): ${group.join(', ')}`);
            } else {
              group.forEach(p => document.getElementById('cell-' + p).classList.add('warn'));
              warning.push(`🔴 非金色双已知组合 (${color}): ${group.join(', ')}`);
            }
          } else {
            others.push(`❓ 所有组合 (${color}): ${group.join(', ')} => [${states.join(', ')}]`);
          }
        }
      }
      allResults.push(...matched, ...potential, ...warning, ...others);
      document.getElementById('results').innerHTML = allResults.join('<br>');
    }

    function resetGrid() {
      for (const pos of positions) {
        cellStates[pos] = '';
        const div = document.getElementById('cell-' + pos);
        div.className = 'cell';
        div.innerText = pos;
      }
      document.getElementById('results').innerHTML = '';
      document.getElementById('suggestionBox').value = '';
    }

    function suggestCombination() {
      const output = [];
      for (const [pos, color] of Object.entries(cellStates)) {
        if (color) output.push(pos + color);
      }
      document.getElementById('suggestionBox').value = output.length ? output.join(' ') : '⚠️ 请至少选择一个颜色位置';
    }

    fetch('./data/combinations.json')
      .then(res => res.json())
      .then(data => {
        combinationData = data;
      })
      .catch(err => {
        document.getElementById('results').innerText = '❌ 无法加载组合数据：' + err;
      });

    function recommendNextDraw() {
      if (!combinationData || Object.keys(combinationData).length === 0) return;
      const scores = {};
      const reasons = {};

      positions.forEach(p => { if (!cellStates[p]) scores[p] = 0; });

      for (const [color, combos] of Object.entries(combinationData)) {
        for (const group of combos) {
          const known = group.filter(p => cellStates[p]);
          const unknown = group.filter(p => !cellStates[p]);
          const knownColor = known.every(p => cellStates[p] === cellStates[known[0]]) ? cellStates[known[0]] : null;

          if (known.length === 2 && unknown.length === 1 && knownColor === color) {
            const target = unknown[0];
            if (knownColor === '金') {
              scores[target] = (scores[target] || 0) + 10;
              if (!reasons[target]) reasons[target] = new Set();
              reasons[target].add(`该位置可补足金色组合 ${group.join(', ')}`);
            } else {
              scores[target] = (scores[target] || 0) - 10;
              if (!reasons[target]) reasons[target] = new Set();
              reasons[target].add(`该位置可能补成 ${knownColor} 组合，应避免（组合 ${group.join(', ')})`);
            }
          }
        }
      }

      const ranked = Object.entries(scores)
        .filter(([, score]) => score > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      let recommendText = '';
      if (ranked.length) {
        recommendText += '<strong>🌟 推荐尝试以下位置：</strong><br>';
        ranked.forEach(([pos, score], idx) => {
          recommendText += `${idx + 1}. 位置 ${pos}（得分 ${score}）<br>`;
          if (reasons[pos]) {
            recommendText += `<ul>` + [...reasons[pos]].map(r => `<li>${r}</li>`).join('') + `</ul>`;
          }
        });
      } else {
        recommendText = '⚠️ 暂无推荐（请先翻开两个格子，避免非金色组合）';
      }

      document.getElementById('results').innerHTML = recommendText + '<br><br>' + document.getElementById('results').innerHTML;
    }
  </script>
</body>
</html>
