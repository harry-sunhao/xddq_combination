<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="baidu-site-verification" content="codeva-wHipxPyLvU" />
  <meta name="keywords" content="寻道大千, 工具合集, 导航平台, 在线资源, 实用网站, 炼器大会">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://xddq.thinkly.it.com/index.html">

  <title>寻道大千 | 首页 - 功能合集导航</title>
  <meta name="description" content="这是寻道大千的主页面，提供多个实用功能入口，如仙兽棋盘、炼器大会等。">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background: #007bff;
    }
    .tab-button {
      flex: 1 1 auto;
      min-width: 140px;
      padding: 15px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
    }
    .tab-button.active {
      background: #0056b3;
    }
    .tab-content {
      display: none;
      flex-grow: 1;
    }
    .tab-content.active {
      display: block;
    }
    iframe {
      width: 100%;
      height: 60dvh;
      border: none;
      display: none;
    }.loader {
      text-align: center;
      font-size: 16px;
      color: #333;
      padding: 30px;
      animation: blink 1s infinite;
    }
    .placeholder {
      text-align: center;
      padding: 40px 20px;
      font-size: 16px;
      color: #555;
    }
    .donation {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 5px;
    }
    .donation img {
      width: 100%;
      max-width: 480px;
      height: auto;
      margin-top: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    footer {
      font-size: 13px;
      color: #999;
      text-align: center;
      padding: 5px 10px 10px;
      margin-top: auto;
    }
    @media (max-width: 600px) {
      .tab-button {
        font-size: 14px;
        padding: 12px;
      }
      .donation img {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <header>
    <button class="tab-button active" onclick="switchTab('tab-chess')">仙兽棋盘推荐</button>
    <button class="tab-button" onclick="switchTab('tab-2048')">炼器大会AI</button>
  </header>

  <main>
    <section id="tab-chess" class="tab-content active">
      <div class="placeholder" id="placeholder-chess">
        🧩 欢迎使用【仙兽棋盘推荐】功能<br>点击上方按钮即可加载工具内容。
      </div>
      <div class="loader" id="loader-chess">🔄 正在加载仙兽棋盘，请稍候...</div>
      <iframe title="仙兽棋盘工具" data-src="./chess.html"></iframe>
    </section>

    <section id="tab-2048" class="tab-content">
      <div class="placeholder" id="placeholder-2048">
        🔮 欢迎体验【炼器大会 AI 模拟】<br>点击上方标签加载炼器策略分析系统。
      </div>
      <div class="loader" id="loader-2048">🔮 正在加载炼器大会 AI 模拟器，请稍候...</div>
      <iframe title="炼器大会 AI 模拟器" data-src="2048/index.html"></iframe>
    </section>

    <section class="donation">
      ☕ 如果你觉得有用，欢迎打赏支持：<br>
      <img src="./img/qrcode.jpg" alt="寻道大千网站赞助二维码，欢迎打赏支持">
    </section>
  </main>

  <footer>
    <div>
      © 2025 桃源·太叔 版权所有 · Powered by
      <a href="https://github.com/harry-sunhao" target="_blank" style="color:#999; text-decoration:none; margin-left: 5px;">云在天(Harry)</a>
    </div>
    <div>
      <span id="busuanzi_container_site_pv" style="margin-right: 10px;">
        🔢 访问总量：<span id="busuanzi_value_site_pv"></span>
      </span>
      <span id="busuanzi_container_site_uv" style="margin-right: 10px;">
        👥 访客数：<span id="busuanzi_value_site_uv"></span>
      </span>
    </div>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  </footer>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

      document.querySelector(`[onclick*="${id}"]`).classList.add('active');
      const tab = document.getElementById(id);
      tab.classList.add('active');

      const iframe = tab.querySelector('iframe');
      const placeholder = tab.querySelector('.placeholder');
      const loader = tab.querySelector('.loader');

      if (!iframe.src) {
        iframe.src = iframe.dataset.src;
        iframe.style.display = "none";
        if (placeholder) placeholder.style.display = "none";
        iframe.onload = () => {
          iframe.style.display = "block";
          if (loader) loader.style.display = "none";
        };

      }else {
        iframe.style.display = "block";
        if (loader) loader.style.display = "none";
      }
    }
  </script>
</body>
</html>
